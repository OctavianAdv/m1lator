name: release

# Push a tag like v1.2.0 (must match the VERSION file) -> publishes m1lator-<tag>.zip as a GitHub Release.
# Needs: Settings -> Actions -> General -> Workflow permissions -> "Read and write permissions".
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check VERSION matches tag
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          if ("v$v" -ne '${{ github.ref_name }}') { Write-Error "VERSION is $v but tag is ${{ github.ref_name }}"; exit 1 }

      - name: Package
        shell: pwsh
        run: |
          $out = 'dist/m1lator'
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item -Recurse bin, scripts $out
          Copy-Item Install.bat, Uninstall.bat, Update.bat, Hypervisor-Off.bat, Hypervisor-On.bat, README.md, VERSION $out
          Compress-Archive -Path "$out/*" -DestinationPath "dist/m1lator-${{ github.ref_name }}.zip"

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
