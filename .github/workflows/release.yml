name: release

# Push a tag like v1.0.2 -> publishes m1lator-<tag>.zip (prebuilt bin + scripts) as a GitHub Release.
# Needs: Settings -> Actions -> General -> Workflow permissions -> "Read and write permissions".
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package
        shell: pwsh
        run: |
          $out = 'dist/m1lator'
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item -Recurse bin, scripts $out
          Copy-Item Install.bat, Uninstall.bat, README.md $out
          Compress-Archive -Path "$out/*" -DestinationPath "dist/m1lator-${{ github.ref_name }}.zip"

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
